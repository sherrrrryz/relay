<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay Wallet</title>
  <meta name="description" content="Tap the wallet and the Relay card drops in. A small three.js motion study. The full prototype with every tab lives at prototype/." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens/tokens.css" />
  <link rel="stylesheet" href="prototype/demos/card-drop.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: var(--color-sand-200); color: var(--color-text-default); font-family: Inter, system-ui, -apple-system, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
    /* standalone: the stage is the whole viewport */
    .card-drop { position: fixed; inset: 0; min-height: 0; height: auto; border-radius: 0; }
    .card-drop__hint { font: 14px/1.4 Inter, system-ui, sans-serif; }
    .card-drop__status { font: italic 20px/1.2 "Instrument Serif", Georgia, serif; color: var(--color-text-default); opacity: .8; }
    .card-drop__loading { background: var(--color-sand-200); font: 13px/1 Inter, system-ui, sans-serif; z-index: 2; }
    .card-drop__nav { position: fixed; top: 20px; right: 24px; margin: 0; font: 13px/1.4 Inter, system-ui, sans-serif; color: var(--color-text-subtle); z-index: 1; }
    .card-drop__nav a { color: inherit; }
    @media (max-width: 600px) { .card-drop__ui { padding: 20px 16px; } .card-drop__status { font-size: 17px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
  </script>
</head>
<body>
  <div class="card-drop" id="card-drop" tabindex="0" role="application" aria-label="Relay card floating above a black wallet. Tap the wallet to drop the card in; press Space to toggle.">
    <div class="card-drop__ui">
      <p class="card-drop__hint" id="card-drop-hint" aria-live="polite">Tap the wallet to drop the card in</p>
      <p class="card-drop__status" id="card-drop-status">Card is out</p>
    </div>
    <div class="card-drop__loading" id="card-drop-loading">Loading</div>
  </div>
  <p class="card-drop__nav"><a href="prototype/#card-drop">All prototypes →</a></p>

  <script type="module">
    import { mountCardDrop } from "./prototype/demos/card-drop.js";
    await mountCardDrop(document.getElementById("card-drop"), {
      assetBase: "assets",
      hint: document.getElementById("card-drop-hint"),
      status: document.getElementById("card-drop-status"),
    });
    document.getElementById("card-drop-loading").classList.add("is-done");
  </script>
</body>
</html>
